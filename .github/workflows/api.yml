# API test-generator suite (packages/api). Relocated from packages/api/.github/workflows/ci.yml
# and adapted for the npm-workspaces monorepo: deps install once at the repo root, all package
# scripts run with working-directory: packages/api (which also satisfies the generator's
# process.cwd() coupling), and artifact paths carry the packages/api/ prefix.
name: API

on:
  pull_request:
    paths:
      - 'packages/api/**'
      - '.github/workflows/api.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/api/**'
      - '.github/workflows/api.yml'
      - 'package.json'
      - 'package-lock.json'

# Least privilege: every step only reads the repo (checkout, local generation, git diff against
# the local index); nothing pushes, comments, or writes via the GitHub API.
permissions:
  contents: read

defaults:
  run:
    working-directory: packages/api

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_GENERATED_API_SMOKE: ${{ vars.RUN_GENERATED_API_SMOKE }}
      SMOKE_BASE_URL: ${{ secrets.BASE_URL }}
      SMOKE_USER_ID: ${{ secrets.USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Validate
        run: npm run ci

      - name: Generated suite drift check
        run: |
          npm run generate -- --har ./examples
          git add -A tests/generated
          git diff --cached --exit-code -- tests/generated

      - name: Generated API smoke
        if: ${{ env.RUN_GENERATED_API_SMOKE == 'true' && env.SMOKE_BASE_URL != '' && env.SMOKE_USER_ID != '' }}
        env:
          BASE_URL: ${{ env.SMOKE_BASE_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          USER_ID: ${{ env.SMOKE_USER_ID }}
          QUERY_ID: ${{ secrets.QUERY_ID }}
          X_SITE_UUID: ${{ secrets.X_SITE_UUID }}
        run: npm run test:api:smoke

      - name: Upload Playwright and generated-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          if-no-files-found: ignore
          path: |
            packages/api/playwright-report
            packages/api/test-results
            packages/api/tests/generated/run-manifest.json
            packages/api/tests/generated/.env.generated.example
