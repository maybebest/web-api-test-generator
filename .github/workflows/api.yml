# API test-generator suite (packages/api). Relocated from packages/api/.github/workflows/ci.yml
# and adapted for the npm-workspaces monorepo: deps install once at the repo root, all package
# scripts run with working-directory: packages/api (which also satisfies the generator's
# process.cwd() coupling), and artifact paths carry the packages/api/ prefix.
name: API

on:
  # On-demand reruns plus a nightly
  # deterministic run: lint + build + unit + drift + the mock-backed replay below need no
  # live credentials, so the scheduled run is safe and self-contained.
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    paths:
      - "packages/api/**"
      - ".github/workflows/api.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
      - master
    paths:
      - "packages/api/**"
      - ".github/workflows/api.yml"
      - "package.json"
      - "package-lock.json"

# Least privilege: every step only reads the repo (checkout, local generation, git diff against
# the local index); nothing pushes, comments, or writes via the GitHub API.
permissions:
  contents: read

defaults:
  run:
    working-directory: packages/api

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Validate
        run: npm run ci

      - name: Audit dependencies
        working-directory: ${{ github.workspace }}
        run: npm audit --audit-level=high

      # Deterministic, credential-free execution of the generated @smoke suite against an in-repo
      # mock (scripts/replay-mock-server.mjs). Proves the generated tests run and assert green
      # without a live system-under-test.
      - name: Generated suite replay (mock-backed)
        run: npm run test:api:replay

      # The committed tests/generated suite is produced from the captures recorded in
      # run-manifest.json. Most are gitignored raw WebInspector captures (examples/*.md) that
      # contain real secrets and are therefore absent in CI checkouts (only the sanitized
      # examples/session.har is committed). Regenerating without them cannot reproduce the committed
      # output, so only run the regenerate-and-diff when every source capture is actually present
      # (e.g. locally) — otherwise skip with a notice rather than false-fail. The mock-backed replay
      # above is what exercises the committed suite in CI.
      - name: Generated suite drift check (when source captures are present)
        run: |
          # Distinct exit codes so a GUARD CRASH (missing/corrupt run-manifest.json, renamed
          # sources.harFiles field -> TypeError) can't masquerade as "captures absent -> skip":
          #   0 = captures present -> run the regenerate-and-diff
          #   2 = captures absent  -> loud skip
          #   other = guard error  -> fail the step
          rc=0
          node -e "const fs=require('fs');const m=require('./tests/generated/run-manifest.json');const miss=(m.sources.harFiles||[]).filter(f=>!fs.existsSync(f));if(miss.length){console.log('source captures not in this checkout: '+miss.join(', '));process.exit(2)}" || rc=$?
          if [ "$rc" = "0" ]; then
            npm run generate -- --har ./examples
            git add -A tests/generated
            git diff --cached --exit-code -- tests/generated
          elif [ "$rc" = "2" ]; then
            echo "::warning::Generated-suite drift check skipped — source HAR captures are not in this checkout."
          else
            echo "::error::Drift-check guard crashed (exit $rc) — run-manifest.json missing/corrupt or its schema changed."
            exit 1
          fi

      - name: Upload Playwright and generated-test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-artifacts
          if-no-files-found: ignore
          path: |
            packages/api/playwright-report
            packages/api/test-results
            packages/api/tests/generated/.har-api-tests-generated.json
            packages/api/tests/generated/run-manifest.json
            packages/api/tests/generated/.env.generated.example
            packages/api/config/calibration-overrides.json

  live:
    name: Trusted live API checks
    needs: test
    # Secrets are never evaluated by pull_request or schedule jobs. Live traffic is limited to the
    # checked-in default branch after merge (or a dispatch of that same branch) and enabled by a
    # repository-level machine policy flag.
    if: >-
      ${{
        vars.RUN_API_LIVE == 'true' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TRUSTED_API_ORIGINS: ${{ vars.TRUSTED_API_ORIGINS }}
      API_ENVIRONMENT_CLASS: ${{ vars.API_ENVIRONMENT_CLASS }}
      API_MUTATION_SCOPE: ${{ vars.API_MUTATION_SCOPE }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      USER_ID: ${{ secrets.USER_ID }}
      QUERY_ID: ${{ secrets.QUERY_ID }}
      X_SITE_UUID: ${{ secrets.X_SITE_UUID }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      API_AUTHORIZATION: ${{ secrets.API_AUTHORIZATION }}
      API_COOKIE: ${{ secrets.API_COOKIE }}
      API_KEY: ${{ secrets.API_KEY }}
      CSRF_TOKEN: ${{ secrets.CSRF_TOKEN }}
      AUTH_STRATEGY: ${{ vars.AUTH_STRATEGY }}
      AUTH_LOGIN_URL: ${{ vars.AUTH_LOGIN_URL }}
      AUTH_LOGIN_BODY: ${{ secrets.AUTH_LOGIN_BODY }}
      AUTH_COOKIE_ORIGINS: ${{ vars.AUTH_COOKIE_ORIGINS }}
      AUTH_BEARER_ORIGINS: ${{ vars.AUTH_BEARER_ORIGINS }}
      AUTH_API_KEY_ORIGINS: ${{ vars.AUTH_API_KEY_ORIGINS }}
      AUTH_SECRET_HEADER_ORIGINS: ${{ vars.AUTH_SECRET_HEADER_ORIGINS }}

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Enforce live-target machine policy
        run: npx tsx src/safety/liveExecutionPolicy.ts live

      - name: Generated API read-only smoke
        run: npm run test:api:smoke

      - name: Enforce mutating-target machine policy
        if: ${{ vars.RUN_API_MUTATING == 'true' || vars.RUN_API_CALIBRATION == 'true' }}
        run: npx tsx src/safety/liveExecutionPolicy.ts mutation

      - name: Generated API mutating smoke
        if: ${{ vars.RUN_API_MUTATING == 'true' }}
        run: npm run test:api:smoke:mutating

      - name: Calibrate pending generated contracts
        if: ${{ vars.RUN_API_CALIBRATION == 'true' }}
        run: npm run calibrate:auto

      - name: Upload live API artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-live-artifacts
          if-no-files-found: ignore
          path: |
            packages/api/playwright-report
            packages/api/test-results
            packages/api/config/calibration-overrides.json
