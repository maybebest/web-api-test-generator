# Repo-wide secret scan — the unified gate across both packages (roadmap item: a single
# secret-scan gate). Independent of the api/web workflows: a finding here fails only this check.
# gitleaks runs in git-history mode, which scans committed content. Gitignored raw captures
# (examples/*.md) and local .env / .auth files are outside Git history and therefore are not scanned.
# Config + allowlist live in .gitleaks.toml.
#
# This complements packages/api's fast, git-aware `npm run scan:secrets` backstop (which scans
# the committed api tree); gitleaks additionally covers packages/web, the root, and full history.
name: Secret scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (repo-wide)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --strict -
          tar -xzf "$ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan committed history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
