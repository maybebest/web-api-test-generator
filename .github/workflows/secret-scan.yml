# Repo-wide secret scan — the unified gate across both packages (roadmap item: a single
# secret-scan gate). Independent of the api/web workflows: a finding here fails only this check.
# gitleaks runs in git-history mode, which scans committed content and respects .gitignore, so
# gitignored raw captures (examples/*.md) and local .env / .auth files are never scanned.
# Config + allowlist live in .gitleaks.toml.
#
# This complements packages/api's fast, git-aware `npm run scan:secrets` backstop (which scans
# the committed api tree); gitleaks additionally covers packages/web, the root, and full history.
name: Secret scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (repo-wide)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan committed history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
