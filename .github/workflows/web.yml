# Web E2E suite (packages/web). Relocated from packages/web/.github/workflows/playwright.yml
# and adapted for the npm-workspaces monorepo: deps install once at the repo root, all
# package scripts run with working-directory: packages/web, and `uses:` action paths (cache,
# artifacts, github-script) are repo-root-relative so they carry the packages/web/ prefix.
name: Web E2E

on:
  # Manual re-run button for flake investigation / on-demand cross-browser runs (set the
  # PW_PROJECTS repo variable). No `schedule:` here on purpose: the web suite's
  # smoke/accessibility/regression need a live SUT (PLAYWRIGHT_TEST_BASE_URL), so a cron would
  # go red without a persistent environment — add one once that environment is wired.
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'packages/web/**'
      - '.github/workflows/web.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/web/**'
      - '.github/workflows/web.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main/master pushes queue instead of cancelling — cancelling an
  # in-flight main run loses that commit's CI signal.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/web

jobs:
  quality:
    name: Playwright quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL }}
      CI: true
      # Capture front-end perf during any browser test that runs (opt-in, never fails a test). The
      # performance/ artifact only materialises when live tests actually execute against a SUT.
      COLLECT_PERF: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.pw-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      # Quality gates run smoke + accessibility on chromium only; skip the
      # firefox/webkit downloads. Local full install stays on npm run pw:install.
      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies (advisory)
        working-directory: ${{ github.workspace }}
        run: npm audit --audit-level=high || true

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Run AI script self-tests
        run: npm run ai:test:self

      - name: Check tree is free of runtime artifacts
        run: npm run ai:clean:check

      - name: Report selected AI brain
        run: npm run ai:brain:doctor

      - name: Validate agent-browser skill integration
        run: npm run ai:browser:skill -- --check

      - name: Install and diagnose agent-browser Chrome
        if: vars.RUN_AGENT_BROWSER_DOCTOR == 'true'
        run: |
          npm run ai:browser:install
          npm run ai:browser:doctor

      - name: Validate all flow specs (strict)
        run: npm run ai:spec:validate -- --dir specs --strict

      - name: Check spec drift
        run: npm run ai:spec:drift

      - name: Validate all Chrome Recorder recordings
        run: npm run ai:recording:validate -- --dir recordings

      - name: Check recording drift
        run: npm run ai:recording:drift

      - name: Gate all generated spec/test pairs
        run: npm run ai:test:gate:all

      - name: Gate all recorded test pairs
        run: npm run ai:recording:gate:all

      - name: Skip live browser tests when SUT URL is not configured
        if: ${{ env.PLAYWRIGHT_TEST_BASE_URL == '' }}
        run: echo "PLAYWRIGHT_TEST_BASE_URL is not configured; static AI/spec gates ran, live smoke/accessibility skipped."

      # tests/smoke and tests/accessibility are not committed yet; running playwright against a missing
      # dir hard-errors ("No tests found"). Guard on suite existence and warn loudly when absent so the
      # gate's claim matches the repo instead of failing or pretending.
      - name: Run smoke tests
        if: ${{ env.PLAYWRIGHT_TEST_BASE_URL != '' }}
        run: |
          if [ -d tests/smoke ]; then
            npm run test:e2e:smoke
          else
            echo "::warning::tests/smoke suite is not present — smoke gate skipped."
          fi

      - name: Run accessibility tests
        if: ${{ env.PLAYWRIGHT_TEST_BASE_URL != '' }}
        run: |
          if [ -d tests/accessibility ]; then
            npm run test:e2e:accessibility
          else
            echo "::warning::tests/accessibility suite is not present — accessibility gate skipped."
          fi

      # Generate only when results exist (a failed gate can stop the suite before
      # any test runs); a real generate failure must fail the step, not be masked.
      - name: Generate Allure report
        if: ${{ always() && hashFiles('packages/web/allure-results/**') != '' }}
        run: npm run allure:generate

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-results
          path: packages/web/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-report
          path: packages/web/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write spec coverage catalog
        if: always()
        run: npm run ai:spec:catalog

      - name: Upload spec coverage catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ai-spec-coverage
          path: packages/web/docs/ai-testing/coverage.md
          if-no-files-found: ignore
          retention-days: 14

      # Fork PRs get a read-only GITHUB_TOKEN: createComment would throw and fail
      # the job. Same-repo guard plus continue-on-error keeps the gate signal clean.
      - name: Post PR coverage summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'packages/web/docs/ai-testing/coverage.md';
            const marker = '<!-- ai-playwright-coverage-summary -->';
            const coverage = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Coverage catalog was not generated.';
            const body = [
              marker,
              '## AI Playwright Coverage Summary',
              '',
              coverage,
              '',
              `Workflow run: ${context.runId}`
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: packages/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Aggregated front-end performance report (Web Vitals + timing + CDP) written by the
      # perf reporter to packages/web/performance/ (summary.json / samples.jsonl / summary.md).
      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-performance
          path: packages/web/performance/
          if-no-files-found: ignore
          retention-days: 14

      # Gates copy failure evidence into .ai-runs/<run>/evidence and successive
      # gate runs overwrite playwright-report/ — this is the only durable copy.
      - name: Upload gate failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ai-gate-evidence
          path: packages/web/.ai-runs/
          if-no-files-found: ignore
          retention-days: 7

  regression-matrix:
    name: Regression ${{ matrix.project }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Chromium-only by default to match the generated-test execution policy.
        # Cross-browser is opt-in: set the repo variable PW_PROJECTS to e.g.
        # ["chromium","firefox","webkit"].
        project: ${{ fromJSON(vars.PW_PROJECTS || '["chromium"]') }}
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL }}
      CI: true
      COLLECT_PERF: 'true'
      # tests/regression is entirely *.authenticated.spec.ts, which only run in the chromium-auth
      # project. Set this repo variable to 'true' AND provision the auth secrets below to execute
      # them: with E2E_AUTH_REUSE_STATE unset, playwright.config.ts adds the `setup` login project,
      # which needs the credential/selector secrets. Alternatively set E2E_AUTH_REUSE_STATE=true and
      # materialise playwright/.auth/user.json in a prior step.
      E2E_AUTH_ENABLED: ${{ vars.E2E_AUTH_ENABLED }}
      E2E_LOGIN_PATH: ${{ secrets.E2E_LOGIN_PATH }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_LOGIN_EMAIL_SELECTOR: ${{ secrets.E2E_LOGIN_EMAIL_SELECTOR }}
      E2E_LOGIN_PASSWORD_SELECTOR: ${{ secrets.E2E_LOGIN_PASSWORD_SELECTOR }}
      E2E_LOGIN_SUBMIT_SELECTOR: ${{ secrets.E2E_LOGIN_SUBMIT_SELECTOR }}
      E2E_AUTH_SUCCESS_SELECTOR: ${{ secrets.E2E_AUTH_SUCCESS_SELECTOR }}
      E2E_AUTH_SUCCESS_URL_REGEX: ${{ secrets.E2E_AUTH_SUCCESS_URL_REGEX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # Map the Playwright project name to its browser engine so derived
      # projects (mobile-chrome, chromium-auth, ...) install the right binary.
      - name: Resolve browser engine
        id: engine
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          case "$PROJECT" in
            chromium|chromium-*|mobile-chrome) engine=chromium ;;
            firefox|firefox-*) engine=firefox ;;
            webkit|webkit-*|mobile-safari) engine=webkit ;;
            *) engine="$PROJECT" ;;
          esac
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.engine.outputs.engine }}-${{ steps.pw-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      # Install only the matrix project's engine instead of all three browsers.
      - name: Skip regression tests when SUT URL is not configured
        if: ${{ env.PLAYWRIGHT_TEST_BASE_URL == '' }}
        run: echo "::warning::PLAYWRIGHT_TEST_BASE_URL is not configured; regression matrix skipped."

      - name: Install Playwright browsers (${{ steps.engine.outputs.engine }})
        if: ${{ env.PLAYWRIGHT_TEST_BASE_URL != '' }}
        run: npx playwright install --with-deps ${{ steps.engine.outputs.engine }}

      # tests/regression is entirely *.authenticated.spec.ts and runs ONLY in the chromium-auth
      # project — a chromium-engine suite. Non-chromium matrix legs install only their own engine
      # (engine-keyed cache, no chromium binary), so they must not attempt the run; only the
      # chromium leg executes it, and only when E2E_AUTH_ENABLED=true. Everything else skips LOUDLY
      # so a green means "regression actually ran" and a warning says exactly why it didn't.
      - name: Run regression tests
        if: ${{ env.PLAYWRIGHT_TEST_BASE_URL != '' }}
        run: |
          if [ "${{ matrix.project }}" != "chromium" ]; then
            echo "::warning::Regression suite runs only on the chromium matrix leg (tests/regression is all *.authenticated.spec.ts -> chromium-auth); skipped for '${{ matrix.project }}'."
          elif [ "${E2E_AUTH_ENABLED}" = "true" ]; then
            npx playwright test tests/regression --project=chromium-auth
          else
            echo "::warning::Regression suite not executed: set the E2E_AUTH_ENABLED repo variable to 'true' and provision the E2E_* auth secrets to run it."
          fi

      - name: Generate Allure report
        if: ${{ always() && hashFiles('packages/web/allure-results/**') != '' }}
        run: npm run allure:generate

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-results-${{ matrix.project }}
          path: packages/web/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-report-${{ matrix.project }}
          path: packages/web/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report-${{ matrix.project }}
          path: packages/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results-${{ matrix.project }}
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-performance-${{ matrix.project }}
          path: packages/web/performance/
          if-no-files-found: ignore
          retention-days: 14
