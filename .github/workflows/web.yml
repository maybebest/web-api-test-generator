# Web quality and E2E suite. Local quality uses the committed deterministic fixture;
# authenticated regression is a separate opt-in job against an explicit external environment.
name: Web E2E

on:
  # Manual re-run button for deterministic local quality and configured authenticated regression.
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'packages/web/**'
      - '.github/workflows/web.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/web/**'
      - '.github/workflows/web.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main/master pushes queue instead of cancelling — cancelling an
  # in-flight main run loses that commit's CI signal.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: packages/web

jobs:
  quality:
    name: Playwright quality gates
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      # Capture front-end perf during any browser test that runs (opt-in, never fails a test). The
      # performance/ artifact only materialises when live tests actually execute against a SUT.
      COLLECT_PERF: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.pw-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      # Quality gates run smoke + accessibility on chromium only; skip the
      # firefox/webkit downloads. Local full install stays on npm run pw:install.
      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies
        working-directory: ${{ github.workspace }}
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint TypeScript and Playwright tests
        run: npm run lint

      - name: Statically review all generated spec/test pairs before Playwright imports them
        run: npm run ai:test:review:all

      - name: Statically review all recorded pairs before Playwright imports them
        run: npm run ai:recording:review:all

      - name: Run deterministic local browser suite
        run: npm run test:e2e:local

      - name: Upload deterministic local Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-local-playwright-report
          path: packages/web/playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload deterministic local test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-local-test-results
          path: packages/web/test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Run AI script self-tests
        run: npm run ai:test:self

      - name: Run offline golden evaluation
        run: npm run ai:eval

      - name: Check tree is free of runtime artifacts
        run: npm run ai:clean:check:tracked

      - name: Report selected AI brain
        run: npm run ai:brain:doctor

      - name: Validate agent-browser skill integration
        run: npm run ai:browser:skill -- --check

      - name: Install and diagnose agent-browser Chrome
        if: vars.RUN_AGENT_BROWSER_DOCTOR == 'true'
        run: |
          npm run ai:browser:install
          npm run ai:browser:doctor

      - name: Validate all flow specs (strict)
        run: npm run ai:spec:validate -- --dir specs --strict

      - name: Check spec drift
        run: npm run ai:spec:drift

      - name: Validate all Chrome Recorder recordings
        run: npm run ai:recording:validate -- --dir recordings

      - name: Check recording drift
        run: npm run ai:recording:drift

      - name: Select and gate deterministic local generated pairs (honest runtime summary)
        run: npm run ai:test:gate:local-generated

      - name: Gate all recorded test pairs
        run: npm run ai:recording:gate:all

      # Generate only when results exist (a failed gate can stop the suite before
      # any test runs); a real generate failure must fail the step, not be masked.
      - name: Generate Allure report
        if: ${{ always() && hashFiles('packages/web/allure-results/**') != '' }}
        run: npm run allure:generate

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-allure-results
          path: packages/web/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-allure-report
          path: packages/web/allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write spec coverage catalog
        if: always()
        run: npm run ai:spec:catalog

      - name: Upload spec coverage catalog
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-ai-spec-coverage
          path: packages/web/docs/ai-testing/coverage.md
          if-no-files-found: ignore
          retention-days: 14

      # Fork PRs get a read-only GITHUB_TOKEN: createComment would throw and fail
      # the job. Same-repo guard plus continue-on-error keeps the gate signal clean.
      - name: Post PR coverage summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = 'packages/web/docs/ai-testing/coverage.md';
            const marker = '<!-- ai-playwright-coverage-summary -->';
            const coverage = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Coverage catalog was not generated.';
            const body = [
              marker,
              '## AI Playwright Coverage Summary',
              '',
              coverage,
              '',
              `Workflow run: ${context.runId}`
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-playwright-report
          path: packages/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-test-results
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Aggregated front-end performance report (Web Vitals + timing + CDP) written by the
      # perf reporter to packages/web/performance/ (summary.json / samples.jsonl / summary.md).
      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-performance
          path: packages/web/performance/
          if-no-files-found: ignore
          retention-days: 14

      # Gates copy failure evidence into .ai-runs/<run>/evidence and successive
      # gate runs overwrite playwright-report/ — this is the only durable copy.
      - name: Upload gate failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-ai-gate-evidence
          path: packages/web/.ai-runs/
          if-no-files-found: ignore
          retention-days: 7


  authenticated-regression:
    name: Authenticated regression
    if: ${{ vars.E2E_AUTH_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: quality
    runs-on: ubuntu-latest
    # Individual deletion-dialog cases are capped at 6–8 minutes and execute once each.
    # 120 minutes leaves headroom for the rest of the serialized external regression suite.
    timeout-minutes: 120
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL }}
      E2E_AUTH_ALLOWED_HOSTS: ${{ secrets.E2E_AUTH_ALLOWED_HOSTS }}
      CI: true
      E2E_AUTH_ENABLED: 'true'
      E2E_LOGIN_PATH: ${{ secrets.E2E_LOGIN_PATH }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_LOGIN_EMAIL_SELECTOR: ${{ secrets.E2E_LOGIN_EMAIL_SELECTOR }}
      E2E_LOGIN_PASSWORD_SELECTOR: ${{ secrets.E2E_LOGIN_PASSWORD_SELECTOR }}
      E2E_LOGIN_SUBMIT_SELECTOR: ${{ secrets.E2E_LOGIN_SUBMIT_SELECTOR }}
      E2E_AUTH_SUCCESS_SELECTOR: ${{ secrets.E2E_AUTH_SUCCESS_SELECTOR }}
      E2E_AUTH_SUCCESS_URL_REGEX: ${{ secrets.E2E_AUTH_SUCCESS_URL_REGEX }}
      NECTAR_PLANNING_SESSION_ID: ${{ secrets.NECTAR_PLANNING_SESSION_ID }}
      NECTAR_AUTH_ALLOWED_ISSUERS: ${{ secrets.NECTAR_AUTH_ALLOWED_ISSUERS }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Validate external auth configuration
        shell: bash
        run: |
          missing=()
          for name in PLAYWRIGHT_TEST_BASE_URL E2E_USER_EMAIL E2E_USER_PASSWORD NECTAR_PLANNING_SESSION_ID NECTAR_AUTH_ALLOWED_ISSUERS; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ -z "$E2E_AUTH_SUCCESS_SELECTOR" ] && [ -z "$E2E_AUTH_SUCCESS_URL_REGEX" ]; then
            missing+=("E2E_AUTH_SUCCESS_SELECTOR or E2E_AUTH_SUCCESS_URL_REGEX")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Authenticated regression is enabled but required configuration is missing: ${missing[*]}"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run serialized authenticated regression
        run: npx playwright test tests/regression --project=chromium-auth --workers=1 --retries=0
