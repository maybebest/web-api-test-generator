testCases:
  - id: TC-GHM-001
    title: Enter Measurement SKUs in chat and verify they are mapped into the Measurement SKUs table
    area: Global Measurement / Hero SKU management
    priority: Critical
    type: E2E
    technique: [Positive]
    traces:
      tickets: [NUP-15404 Background 1, NUP-15404 Scenario 7]
      sourceRefs: [NUP-15404.md#Description/Background 1, NUP-15404.md#Acceptance Criteria/Scenario 7]
    preconditions:
    - User is authenticated in Nectar360 Pollen Nectar AI Media Planner
    - A new media plan conversation is started and initial campaign details have been provided
    - A brand is selected so SKUs are linkable
    testData:
    - "Brand: AlpenGold"
    - "Measurement SKUs entered via chat: SKU-1001 (Choc Bar 100g), SKU-1002 (Choc Bar 200g), SKU-1003 (Hazelnut 90g)"
    steps:
    - 1. Read the Nectar AI initial prompt for SKU entry
    - 2. Type the three SKU identifiers/names into the chat input and submit
    - 3. Wait for the assistant turn to complete (30-60s)
    - 4. Inspect the first (Measurement SKUs) table
    expected:
    - "Initial assistant message reads exactly: \"Thank you for providing the initial details. Please add all measurement and hero skus for this campaign. You can search for a product using a SKU number or a product name. Once your measurement SKUs are confirmed, you'll choose which should be your hero skus.\""
    - All 3 entered SKUs appear as rows in the MEASUREMENT SKUs table (first table)
    - The table is labelled Measurement SKUs (not the old 'Campaign SKUs' naming) in the conversation window
    - "Review prompt is shown: \"Please review your measurement SKU list. Use the edit button to amend items or the bin icon to remove them. If you're happy with your selection, click confirm to move on.\""
    automationNotes: Poll for assistant completion via chat message stream (await network idle / typing indicator gone) up to 60s before asserting table rows; locate first table by its 'Measurement SKUs' heading; assert verbatim prompt strings.
  - id: TC-GHM-002
    title: Confirm button is disabled until at least one Measurement SKU is selected
    area: Global Measurement / Hero SKU management
    priority: Critical
    type: UI
    technique: [Negative, Boundary-BVA]
    traces:
      tickets: [NUP-15404 Background 2]
      sourceRefs: [NUP-15404.md#Description/Background 2]
    preconditions:
    - Measurement SKUs have been mapped into the first table (GHM-001 completed)
    - No Measurement SKU row is selected yet
    testData:
    - "Mapped Measurement SKUs: SKU-1001, SKU-1002, SKU-1003"
    - "Selected count at start: 0"
    steps:
    - 1. Observe the Confirm button state with zero Measurement SKUs selected
    - 2. Select one Measurement SKU row (e.g. SKU-1001)
    - 3. Observe the Confirm button state
    expected:
    - With 0 Measurement SKUs selected the Confirm button is disabled (non-clickable)
    - After selecting 1 Measurement SKU the Confirm button becomes enabled
    - "Boundary assumption: enable threshold is exactly >=1 selected (0 = disabled, 1 = enabled) per Background 2"
    automationNotes: Assert button disabled attribute / aria-disabled at 0 selection; toggle one row checkbox; re-assert enabled. Confirm button scoped to the Measurement table block.
  - id: TC-GHM-003
    title: Attempt to Confirm with zero Measurement SKUs selected is blocked
    area: Global Measurement / Hero SKU management
    priority: High
    type: UI
    technique: [Negative, Error-Message]
    traces:
      tickets: [NUP-15404 Background 2]
      sourceRefs: [NUP-15404.md#Description/Background 2]
    preconditions:
    - Measurement SKUs mapped into first table
    - Zero Measurement SKU rows selected
    testData:
    - "Mapped Measurement SKUs: SKU-1001, SKU-1002, SKU-1003"
    - "Selected: 0"
    steps:
    - 1. Without selecting any Measurement SKU, attempt to click the Confirm button
    - 2. Observe whether the Hero SKU selection box appears
    expected:
    - The Confirm action does not proceed (button is non-interactive while disabled)
    - The second grey Hero SKU summary box does NOT appear
    - No Hero selection flow is started
    - "Assumption: because the control is disabled rather than showing an inline error, no validation message text is expected; note if app instead surfaces an error message"
    automationNotes: Force-click via JS to confirm the handler does nothing when disabled; assert absence of the grey Hero box (heading 'Hero SKUs' second block) after click.
  - id: TC-GHM-004
    title: After Confirm, second grey Hero SKU selection box appears offering the mapped Measurement SKUs
    area: Global Measurement / Hero SKU management
    priority: Critical
    type: E2E
    technique: [Positive, State-Recompute]
    traces:
      tickets: [NUP-15404 Background 3, NUP-15404 Scenario 7]
      sourceRefs: [NUP-15404.md#Description/Background 3, NUP-15404.md#Acceptance Criteria/Scenario 7]
    preconditions:
    - Measurement SKUs mapped (GHM-001)
    - At least one Measurement SKU selected and Confirm enabled
    testData:
    - "Measurement SKUs: SKU-1001, SKU-1002, SKU-1003 (all selected)"
    steps:
    - 1. Select all 3 Measurement SKUs
    - 2. Click Confirm
    - 3. Wait for assistant turn to complete
    - 4. Inspect the newly appeared grey summary box
    expected:
    - A second grey summary box appears for selecting Hero SKUs
    - The Hero box offers exactly the SKUs that were selected as Measurement SKUs (SKU-1001, SKU-1002, SKU-1003)
    - "Follow-up assistant prompt reads exactly: \"Please choose which of these should be your hero SKUs. They'll be assigned to all channels automatically, and you can edit this later via the summary panel on the right.\""
    - "Assumption per NUP-15404 Background 3: list is category-specific and limited to the previously entered Measurement SKUs (note NUP-20956 later supersedes this to all brand-linked SKUs)"
    automationNotes: Wait for assistant completion after Confirm; locate second grey box by 'Hero SKUs' heading; assert its option rows match the Measurement selection set.
  - id: TC-GHM-005
    title: Hero selection box only offers SKUs from the entered Measurement list (category-specific)
