    area: Cross-cutting end-to-end journeys
    priority: High
    type: E2E
    technique: [Negative, Boundary-BVA, State-Recompute, Error-Message]
    traces:
      tickets: [NUP-17750, NUP-15404 Background 2, NUP-17751, NUP-17546]
      sourceRefs: [NUP-15404.md#Description/Background 2, NUP-17750.md#Description]
    preconditions:
    - User logged in, fresh media plan, brand selected
    - No SKUs selected yet
    testData:
