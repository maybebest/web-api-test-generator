  - id: TC-CHL-027
    title: "Decision table: delete-channel unique-count recompute across (unique-Hero | shared-Hero | empty-Hero) channels"
    area: Channel-level Hero SKU assignment
    priority: High
    type: Integration
    technique: [Decision-Table, State-Recompute, Edge-Case]
    traces:
      tickets: [NUP-18943 Background 7, NUP-18943 Notes 2, NUP-18943 Constraints 3]
      sourceRefs: [NUP-18943.md#Background, NUP-18943.md#Notes]
    preconditions:
    - "Measurement SKUs: SKU-A, SKU-B, SKU-C"
    - "Three channels confirmed: Ch1 Hero={SKU-A (shared)}, Ch2 Hero={SKU-B (unique)}, Ch3 Hero={} (empty)"
    - Unique Hero count = 2 (SKU-A, SKU-B)
    testData:
    - Delete Ch3 (empty) -> expect unique stays 2
    - Delete Ch2 (unique SKU-B) -> expect unique drops to 1
    - Delete Ch1 (shared SKU-A, but only channel left) -> expect unique drops to 0
    steps:
    - 1. Configure Ch1={SKU-A}, Ch2={SKU-B}, Ch3={} and confirm; read unique Hero count (=2)
    - 2. Delete Ch3 (empty channel); complete final channel confirmation; read count
    - 3. Delete Ch2 (holds unique SKU-B); complete final channel confirmation; read count
    - 4. Delete Ch1 (last channel, held SKU-A); complete final channel confirmation; read count
    expected:
    - "After deleting empty Ch3: unique Hero count remains 2 (no Hero contributed by Ch3)"
    - "After deleting Ch2 (unique SKU-B): unique Hero count drops 2 -> 1 (SKU-A remains via Ch1)"
    - "After deleting Ch1 (last channel): unique Hero count drops 1 -> 0 (no channels remain)"
    - All recomputes occur AFTER final channel confirmation per Background 7 / Notes 2
    automationNotes: Full 3-row decision table for delete-channel recompute (draft has CHL-010/011/021 individually; this asserts them as one ordered matrix). Poll count after each delete + final confirmation.
