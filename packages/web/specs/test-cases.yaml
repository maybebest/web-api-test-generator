    technique: [Decision-Table, Boundary-BVA, Negative]
    traces:
      tickets: [NUP-17750, NUP-18944, NUP-15404 Background 2]
      sourceRefs: [NUP-17750.md#Description, NUP-15404.md#Description/Background 2]
    preconditions:
    - Brand selected with enough linkable SKUs to exceed MAX
    - Assumed Measurement MIN=1, Hero MIN=1, channel Hero MAX=3 (parameterised)
    testData:
    - "Measurement: 0 (below-min) vs 1 (at-min)"
    - "Global Hero: 0 (below-min) vs 1 (at-min) vs MAX vs MAX+1"
    - "Channel Hero: 0 vs 1 vs 3 (MAX) vs 4 (MAX+1)"
    steps:
    - "1. Measurement context: select 0 -> Confirm disabled; select 1 -> Confirm enabled"
    - "2. Global Hero context: 0 -> blocked; 1 -> allowed; assign up to MAX -> allowed; MAX+1 -> blocked-or-uncapped per scope"
    - "3. Channel Hero context: 0 -> per-channel min handling; 1 -> allowed; 3 (MAX) -> allowed; 4 (MAX+1) -> blocked with message"
    expected:
    - Measurement below-min (0) blocks Confirm; at-min (1) enables Confirm (NUP-15404 Background 2)
    - Global Hero below-min (0) blocks Hero confirm; at-min (1) allowed; global level has no hard MAX cap (max is channel-scoped) - MAX+1 at global accepted but flagged at channel
    - Channel Hero at-MAX (3) accepted; MAX+1 (4) blocked with correcting message (NUP-18944)
    - Consolidated min/max decision matrix across the three selection contexts; each cell asserted independently
    - "ASSUMPTION: MIN=1, MAX=3 parameterised; exact values config-driven from NUP-18944"
    automationNotes: Umbrella decision table consolidating VAL-006..VAL-012 cells into one matrix with explicit at/below-min and at/above-max columns per context. Parameterise MIN/MAX. Distinguishes global-uncapped vs channel-capped MAX semantics.
