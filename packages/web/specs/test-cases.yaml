    - "Recovery: add and confirm 1 Measurement SKU (SKU-1001), assign 1 Hero"
    - Assumed MIN = 1
    steps:
    - 1. Reach the SKU step with Measurement SKUs mapped but select 0
    - 2. Confirm the Measurement Confirm button is disabled and the flow cannot advance to channels
    - 3. Select 1 Measurement SKU (at-min) and confirm; assign 1 Hero and confirm
    - 4. Proceed to channel selection and verify assignment is now possible
    expected:
