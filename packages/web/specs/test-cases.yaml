  - id: TC-GHM-007
    title: Unassign a Hero SKU (hover -> remove) toggles it back to unassigned
    area: Global Measurement / Hero SKU management
    priority: High
    type: UI
    technique: [Positive, State-Recompute]
    traces:
      tickets: [NUP-15404 Scenario 2, NUP-15404 Background 4]
      sourceRefs: [NUP-15404.md#Acceptance Criteria/Scenario 2, NUP-15404.md#Description/Background 4]
    preconditions:
    - A SKU has been assigned as Hero (GHM-006)
    - Hero box visible
    testData:
    - "Assigned Hero SKU: SKU-1001"
    steps:
    - 1. Hover over the assigned Hero SKU-1001 row
    - 2. Click the remove/unassign control that appears on hover
    - 3. Observe the row and Hero count
    expected:
    - On hover, an unassign/remove control is revealed for the Hero SKU
    - Clicking it immediately unassigns SKU-1001 ("Added to Hero SKUs" marking is removed)
    - SKU-1001 remains in the list as a Measurement SKU (it is unassigned as Hero, NOT removed from the list)
    - Hero count decrements accordingly
    automationNotes: Trigger hover before asserting the unassign control is visible; assert badge removed and SKU row still present in Measurement table.
  - id: TC-GHM-008
    title: User cannot remove a SKU from the Hero SKUs list (only assign/unassign)
    area: Global Measurement / Hero SKU management
    priority: High
    type: UI
    technique: [Negative, Edge-Case]
    traces:
      tickets: [NUP-15404 Background 4]
      sourceRefs: [NUP-15404.md#Description/Background 4]
    preconditions:
    - Hero selection box visible with candidate SKUs
    testData:
    - "Hero candidates: SKU-1001, SKU-1002, SKU-1003"
    steps:
    - 1. Inspect the Hero SKU rows for any list-removal (delete-from-list) affordance
    - 2. Assign then unassign SKU-1002
    - 3. Re-count the Hero candidate rows
    expected:
    - The Hero box exposes only assign/unassign controls, not a control that deletes a SKU from the candidate list
    - After unassigning SKU-1002 it still appears as a selectable candidate (count of candidate rows unchanged at 3)
    - "Assumption per Background 4: removal of SKUs from the list is not permitted at the Hero step"
    automationNotes: Negative-assert no 'remove from list' / bin icon inside the Hero candidate rows (bin icon belongs to the Measurement table per Scenario 7 review prompt); assert candidate row count stable.
