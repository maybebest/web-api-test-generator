  - id: TC-XJ-025
    title: "E2E auto-add-of-brand-linked-Hero then delete the channel that introduced it: Measurement persists, unique Hero recomputes"
    area: Cross-cutting end-to-end journeys
    priority: High
    type: E2E
    technique: [Edge-Case, State-Recompute, Data-Persistence, Decision-Table]
    traces:
      tickets: [NUP-20956 Scenario 2, NUP-20956 Constraint 6, NUP-18943 Background 7, NUP-17546]
      sourceRefs: [NUP-20956.md#Acceptance Criteria/Scenario 2, NUP-18943.md#Background]
    preconditions:
    - "Measurement confirmed: SKU-1001, SKU-1002"
    - "Global Hero: SKU-1001"
    - "Two channels confirmed: Sponsored Products (SKU-1001), In-store Digital (SKU-1001)"
    testData:
    - At In-store Digital, assign brand-linked SKU-7777 (not a Measurement SKU) as Hero -> auto-added to global Measurement
    - Then delete In-store Digital
    - "Expected Measurement after delete: 3 (SKU-7777 persists); unique Hero after delete: 1 (SKU-1001)"
    steps:
    - 1. At In-store Digital, assign brand-linked non-Measurement SKU-7777 as Hero; confirm
    - 2. Verify SKU-7777 auto-added to global Measurement (count 2 -> 3) and unique Hero count = 2
    - 3. Delete the In-store Digital channel (which uniquely held SKU-7777 as Hero)
    - 4. Complete final channel confirmation
    - 5. Read global Measurement count and unique Hero count
    expected:
    - "After channel Hero assign: global Measurement = 3 (SKU-7777 auto-added), unique Hero = 2 (SKU-1001, SKU-7777)"
    - "After deleting In-store Digital: unique Hero count recomputes 2 -> 1 (SKU-7777 no longer a channel Hero)"
    - Global Measurement count REMAINS 3 - the auto-added SKU-7777 persists in Measurement after channel deletion (auto-add is not reversed by channel delete; global SKUs blocked from removal once a channel was provided per Constraint 6)
    - Measurement list still includes SKU-7777
    automationNotes: Combines auto-add (NUP-20956 Sc2) with delete-channel recompute (NUP-18943 Bg7) and persistence of auto-added Measurement (Constraint 6) - the interaction is not covered by any single draft case. Assert Measurement persists while unique Hero decrements. Mirrors/strengthens ABL-019 with explicit Measurement-persistence assertion.
  - id: TC-XJ-026
    title: "E2E edit-button interplay: global Hero edit stays ENABLED after channel confirmation and only DISABLES on channel-level Hero edit (corrects XJ-010/XJ-023)"
    area: Cross-cutting end-to-end journeys
    priority: High
    type: E2E
    technique: [State-Recompute, Decision-Table, Cross-Field]
    traces:
      tickets: [NUP-18943 Scenario 5, NUP-15404 Scenario 6, NUP-17546]
      sourceRefs: [NUP-18943.md#Acceptance Criteria/Scenario 5, NUP-15404.md#Acceptance Criteria/Scenario 6]
    preconditions:
    - Measurement and global Hero SKUs confirmed
    - Channels can be confirmed independently of editing them
    testData:
    - "Global Hero: SKU-1001"
    - "Channel: Sponsored Products"
    - "Channel Hero edit: add SKU-1002"
    steps:
    - 1. Before any channel work, confirm global Hero edit button is ENABLED
    - 2. Confirm channels but do NOT edit any channel's Hero SKUs; read the global Hero edit button
    - 3. Begin a channel-level Hero edit (add SKU-1002 to Sponsored Products); read the global Hero edit button
    - 4. Confirm the channel edit; read the global Hero edit button
    expected:
    - "Step 1: global Hero edit ENABLED"
    - "Step 2: after channel CONFIRMATION but before channel-level editing, global Hero edit remains ENABLED (NUP-18943 Scenario 5 trigger is channel-level editing, not confirmation)"
    - "Step 3-4: once channel-level Hero editing begins, global Hero edit becomes DISABLED and stays disabled"
    - "CORRECTION of XJ-010 / XJ-023: those cases assert the global Hero edit disables on 'channels confirmed'; per NUP-18943 Scenario 5 the disable trigger is the start of channel-level Hero editing, so the post-confirm/pre-edit state should still be ENABLED"
    - "ASSUMPTION: if the build disables on channel confirm, flag as divergence from NUP-18943 Scenario 5 for source clarification"
    automationNotes: E2E twin of GHM-030-FIX. Distinguishes channel-confirm from channel-edit as the disable trigger across the full journey. Assert ENABLED in step 2, DISABLED from step 3. Supersedes the XJ-010/XJ-023 'disable on confirm' expectation.
