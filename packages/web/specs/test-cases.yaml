    automationNotes: Assert Hero option list equals confirmed Measurement subset; negative-assert absence of SKU-1003 row in the Hero box.
  - id: TC-GHM-006
    title: Assign a Hero SKU via 'Add to Hero SKUs' and verify 'Added to Hero SKUs' visual marking
    area: Global Measurement / Hero SKU management
